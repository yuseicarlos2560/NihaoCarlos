<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nihao Carlos | Language Lab</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">

<div class="app-layout">
  <!-- Sidebar Navigation -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>Nihao Carlos</h1>
      <!-- New Mode Switcher -->
      <div class="mode-switcher">
        <button class="mode-btn active" onclick="switchMode('sessions')">Sessions</button>
        <button class="mode-btn" onclick="switchMode('flashcards')">Flash Cards</button>
        <button class="mode-btn" onclick="switchMode('stats')">Stats</button>
      </div>
      <input type="text" id="session-search" placeholder="Search..." oninput="filterSessions()">
    </div>

    <nav class="video-switcher" id="video-list">
      <!-- Session buttons injected here -->
    </nav>

    <div id="flashcard-list" style="display: none;">
      <!-- Sub-toggle for Cards section -->
      <div class="view-toggle">
        <button id="btn-study-view" class="toggle-btn active" onclick="switchView('study')">Review</button>
        <button id="btn-manage-view" class="toggle-btn" onclick="switchView('manage')">Manage</button>
      </div>

      <div id="study-container">
        <div id="study-setup" style="margin-bottom: 20px;">
          <div class="mode-grid">
            <button class="mode-opt" data-mode="random" onclick="setMode(this)">🎲<br>Random</button>
            <button class="mode-opt" data-mode="new" onclick="setMode(this)">🆕<br>New</button>
            <button class="mode-opt" data-mode="learning" onclick="setMode(this)">🧠<br>Learn</button>
            <button class="mode-opt" data-mode="spaced" onclick="setMode(this)">⏳<br>Spaced</button>
          </div>

          <div class="limit-container">
            <label for="card-limit">Cards to study:</label>
            <input type="number" id="card-limit" value="20" min="1" max="100">
          </div>

          <button class="start-btn" onclick="StudyManager.startGlobalReview()">Start Session</button>
        </div>

        <!-- Study View: Hidden until Start is clicked -->
        <div id="study-ui" style="display:none;">
          <div class="sidebar-card-header">
            <span id="card-progress">0/0</span>
            <button onclick="StudyManager.deleteCurrentCard()" class="btn-icon">🗑️</button>
          </div>

          <div class="card" onclick="StudyManager.flip()">
            <div class="card-inner">
              <div class="card-front" id="card-front-text"></div>
              <div class="card-back">
                <div id="card-back-text" contenteditable="true" onclick="event.stopPropagation()" onblur="StudyManager.saveEdit(this)"></div>
                <small class="edit-hint">(Click to edit)</small>
              </div>
            </div>
          </div>

          <div class="study-controls">
            <button class="btn-grade btn-fail" onclick="StudyManager.handleGrade(false)">Again</button>
            <button class="btn-grade btn-pass" onclick="StudyManager.handleGrade(true)">Got it</button>
            <button class="btn-grade" onclick="StudyManager.closeView()">Exit</button>
          </div>
        </div>
      </div>

      <div id="manage-container" style="display:none;">
        <!-- New Dictionary/Management UI -->
        <div class="manage-header">
          <button class="add-btn" onclick="StudyManager.addNewWord()">+ New Word</button>
        </div>
        <div id="vocab-list-items"></div>
      </div>
    </div>

    <div id="stats-view" style="display: none; padding: 20px;">
      <div id="timeline-chart" class="timeline-chart modern-chart">
        <!-- Dynamic bars injected here -->
      </div>

      <div class="graph-container">
        <div class="stats-controls">
          <!-- Timeframe Selector -->
          <div class="stat-tabs timeframe">
            <button onclick="updateTimelineRange(7)" class="active">7D</button>
            <button onclick="updateTimelineRange(30)">30D</button>
            <button onclick="updateTimelineRange(90)">90D</button>
          </div>

          <!-- Metric Selector -->
          <div class="stat-tabs metrics">
            <button onclick="updateTimelineMetric('added')" class="active">Added</button>
            <button onclick="updateTimelineMetric('studied')">Studied</button>
            <button onclick="updateTimelineMetric('mastered')">Mastered</button>
          </div>
        </div>

        <div class="stat-group">
          <label>New</label>
          <div class="progress-bar"><div id="bar-new" class="fill new" style="width: 0%"></div></div>
          <span id="stat-new">0</span>
        </div>

        <div class="stat-group">
          <label>Learning</label>
          <div class="progress-bar"><div id="bar-learning" class="fill learning" style="width: 0%"></div></div>
          <span id="stat-learning">0</span>
        </div>

        <div class="stat-group">
          <label>Mastered</label>
          <div class="progress-bar"><div id="bar-mastered" class="fill mastered" style="width: 0%"></div></div>
          <span id="stat-mastered">0</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="main-content">
    <div class="study-grid">
      <div class="video-column">
        <div class="video-wrapper">
          <div id="player"></div>
        </div>
      </div>

      <div class="transcript-column">
        <div id="caption-box">
          <div id="transcript"></div>
        </div>
      </div>
    </div>

    <section class="notes-section">
      <div class="section-header">
        <h2>Knowledge Workspace</h2>
        <button class="btn-primary" onclick="addParent()">+ New Concept</button>
      </div>
      <div id="notes-board"></div>
    </section>
  </main>
</div>

<button class="stop-btn" onclick="speechManager.stop()">⏹ Stop Voice</button>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="https://unpkg.com/pinyin-pro"></script>
<script src="script.js"></script>
</body>
</html>
