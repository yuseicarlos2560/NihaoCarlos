<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nihao Carlos | Language Lab</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">

<div class="app-layout">
  <!-- Sidebar Navigation -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>Nihao Carlos</h1>
      <input type="text" id="session-search" placeholder="Search sessions..." oninput="filterSessions()">
    </div>
    <nav class="video-switcher" id="video-list">
      <!-- Buttons injected by JS -->
    </nav>
  </aside>

  <!-- Main Content Area -->
  <main class="main-content">
    <div class="study-grid">
      <div class="video-column">
        <div class="video-wrapper">
          <div id="player"></div>
        </div>
      </div>

      <div class="transcript-column">
        <div id="caption-box">
          <div id="transcript"></div>
        </div>
      </div>
    </div>

    <section class="notes-section">
      <div class="section-header">
        <h2>Knowledge Workspace</h2>
        <div class="review-actions">
          <select id="review-mode-select" class="mode-dropdown">
            <option value="random">Random (All)</option>
            <option value="learning">Learning (Again)</option>
            <option value="new">New Words</option>
            <option value="spaced">Spaced Repetition (3d+)</option>
            <option value="confidence">Confidence (Mastered)</option>
          </select>
          <button class="btn-review" onclick="StudyManager.startGlobalReview()">Start Review</button>
        </div>
        <button class="btn-primary" onclick="addParent()">+ New Concept</button>
      </div>
      <div class="stats-container">
        <div class="stat-item">🆕 New: <span id="stat-new">0</span></div>
        <div class="stat-item">🧠 Learning: <span id="stat-learning">0</span></div>
        <div class="stat-item">✅ Mastered: <span id="stat-mastered">0</span></div>
      </div>
      <div id="notes-board"></div>
    </section>
  </main>
</div>

<div id="flashcard-modal" class="flashcard-modal">
  <div class="modal-header" style="display:flex; gap: 20px; align-items:center;">
    <div id="card-progress"></div>
    <!-- Delete from Global Storage button -->
    <button onclick="StudyManager.deleteCurrentCard()"
            style="background:none; border:1px solid #ff4d4d; color:#ff4d4d; border-radius:5px; cursor:pointer;">
      🗑️ Delete Card
    </button>
  </div>

  <div class="card" onclick="StudyManager.flip()">
    <div class="card-inner">
      <div class="card-front" id="card-front-text"></div>
      <div class="card-back">
        <!-- Add onclick="event.stopPropagation()" here -->
        <div id="card-back-text"
             contenteditable="true"
             onclick="event.stopPropagation()"
             onblur="StudyManager.saveEdit(this)">
        </div>
        <small style="margin-top:20px; opacity:0.5;">(Click text to edit)</small>
      </div>
    </div>
  </div>

  <div class="study-controls">
    <button class="btn-grade btn-fail" onclick="StudyManager.handleGrade(false)">Again</button>
    <button class="btn-grade btn-pass" onclick="StudyManager.handleGrade(true)">Got it</button>
    <button class="btn-grade" onclick="StudyManager.closeModal()">Exit</button>
  </div>
</div>

<button class="stop-btn" onclick="speechManager.stop()">⏹ Stop Voice</button>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="https://unpkg.com/pinyin-pro"></script>
<script src="script.js"></script>
</body>
</html>
